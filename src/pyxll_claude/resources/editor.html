<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1e1e1e; }
    #editor { width: 100%; height: 100%; }
    #error {
      display: none;
      color: #f44747;
      font-family: Consolas, monospace;
      font-size: 13px;
      padding: 16px;
    }
  </style>
</head>
<body>
  <div id="editor"></div>
  <div id="error"></div>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script>
    var bridge       = null;
    var editor       = null;
    var savedContent = '';

    function checkDirty() {
      if (bridge && editor) {
        bridge.postMessage(JSON.stringify({type: 'editor_dirty', dirty: editor.getValue() !== savedContent}));
      }
    }

    function showError(msg) {
      document.getElementById('editor').style.display = 'none';
      var el = document.getElementById('error');
      el.style.display = 'block';
      el.textContent = msg;
    }

    function initMonaco() {
      require.config({
        paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs' }
      });
      require(['vs/editor/editor.main'], function () {
        editor = monaco.editor.create(document.getElementById('editor'), {
          value:                '',
          language:             'python',
          theme:                'vs-dark',
          automaticLayout:      true,
          fontSize:             13,
          fontFamily:           '"Cascadia Code", Consolas, "Courier New", monospace',
          minimap:              { enabled: false },
          scrollBeyondLastLine: false,
          renderWhitespace:     'selection',
          lineNumbers:          'on',
          tabSize:              4,
          insertSpaces:         true,
        });

        // Ctrl+S / Cmd+S → save
        editor.addCommand(
          monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS,
          function () { bridge.postMessage(JSON.stringify({type: 'editor_save', text: editor.getValue()})); }
        );

        // Ctrl+C → Copy (explicitly via bridge if native is blocked)
        editor.addCommand(
          monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyC,
          function () {
            const selection = editor.getSelection();
            const text = editor.getModel().getValueInRange(selection);
            if (text) {
              bridge.copyToClipboard(text);
            }
          }
        );

        // Ctrl+V → Paste (explicitly via bridge if native is blocked)
        editor.addCommand(
          monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyV,
          function () {
            bridge.pasteFromClipboard(function(text) {
              if (text) {
                const selection = editor.getSelection();
                const range = new monaco.Range(
                  selection.startLineNumber, selection.startColumn,
                  selection.endLineNumber, selection.endColumn
                );
                editor.executeEdits('paste', [
                  { range: range, text: text, forceMoveMarkers: true }
                ]);
              }
            });
          }
        );

        editor.onDidChangeModelContent(checkDirty);

        // Signal Python that the editor is ready to receive content
        bridge.postMessage(JSON.stringify({type: 'editor_ready'}));
      });
    }

    new QWebChannel(qt.webChannelTransport, function (channel) {
      bridge = channel.objects.bridge;

      // Python → JS messages
      bridge.messageReceived.connect(function (data) {
        var msg = JSON.parse(data);
        if (msg.type === 'editor_load') {
          savedContent = msg.text;
          if (editor) {
            var pos = editor.getPosition();
            editor.setValue(msg.text);
            if (pos) editor.setPosition(pos);
            checkDirty();
          }
        } else if (msg.type === 'editor_mark_saved') {
          savedContent = editor ? editor.getValue() : savedContent;
          checkDirty();
        } else if (msg.type === 'editor_request_save') {
          if (editor) bridge.postMessage(JSON.stringify({type: 'editor_save', text: editor.getValue()}));
        }
      });

      // Dynamically inject the Monaco loader so QWebChannel is ready first
      var script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/loader.min.js';
      script.onload  = initMonaco;
      script.onerror = function () {
        showError(
          'Could not load Monaco editor.\n' +
          'Check your internet connection or try reloading PyXLL.'
        );
      };
      document.head.appendChild(script);
    });
  </script>
</body>
</html>
