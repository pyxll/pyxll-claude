[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyxll-claude"
version = "0.1.1"
description = "Claude AI terminal inside Microsoft Excel using PyXLL."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.10"
dependencies = [
    "pyxll>=5.1.0",
    "PySide6",
    "pywin32>=301",
    "pywinpty>=2.0",
]

[project.entry-points."pyxll"]
modules = "pyxll_claude:pyxll_modules"
ribbon = "pyxll_claude:pyxll_ribbon"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyxll_claude = ["resources/ribbon.xml", "resources/terminal.html", "resources/editor.html", "resources/*.png", "resources/workspace/**"]
