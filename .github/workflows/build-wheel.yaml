name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Cache tessl skills
        id: cache-tessl
        uses: actions/cache@v4
        with:
          path: .tessl
          key: tessl-${{ hashFiles('tessl.json') }}

      - name: Install tessl skills
        if: steps.cache-tessl.outputs.cache-hit != 'true'
        run: npx tessl install

      - name: Build wheel
        run: uv build

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: |
            ./dist/pyxll_claude-*-py3-none-any.whl
